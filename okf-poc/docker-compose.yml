# Stable project name keeps the Qdrant volume across directory renames.
name: okf-poc

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./knowledge:/app/knowledge
      - ./cache:/app/cache
      - ./config:/app/config
    env_file:
      - .env
    depends_on:
      - qdrant

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Bind mount so vector data survives `docker compose down` / rebuilds.
      # Do NOT use `docker compose down -v` unless you intentionally wipe Qdrant.
      - ./qdrant_storage:/qdrant/storage
