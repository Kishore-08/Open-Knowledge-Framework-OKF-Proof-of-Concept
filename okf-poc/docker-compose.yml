# Stable project name keeps the Qdrant volume across directory renames.
name: okf-poc

services:
  vertex-token:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    environment:
      VERTEX_SERVICE_ACCOUNT_EMAIL: ${VERTEX_SERVICE_ACCOUNT_EMAIL:-}
    volumes:
      # gcloud needs its existing authenticated user session to impersonate the
      # service account. This is for local development only.
      - ${HOME}/.config/gcloud:/root/.config/gcloud
      - vertex_tokens:/tokens
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${VERTEX_SERVICE_ACCOUNT_EMAIL}" ]; then
          echo "VERTEX_SERVICE_ACCOUNT_EMAIL is not configured" >&2
          exit 1
        fi
        while true; do
          if token="$$(gcloud auth print-access-token --impersonate-service-account="$${VERTEX_SERVICE_ACCOUNT_EMAIL}" --quiet)"; then
            {
              date +%s
              printf '%s\n' "$${token}"
            } > /tokens/credentials.tmp
            chmod 600 /tokens/credentials.tmp
            mv /tokens/credentials.tmp /tokens/credentials
            unset token
            sleep 2700
          else
            echo "Vertex token refresh failed; retrying in 60 seconds" >&2
            rm -f /tokens/credentials.tmp
            sleep 60
          fi
        done
    healthcheck:
      # A leftover file is not healthy: reject credentials older than 55
      # minutes so failed host gcloud reauthentication is visible.
      test:
        - CMD-SHELL
        - >-
          test -s /tokens/credentials &&
          created=$$(sed -n '1p' /tokens/credentials) &&
          test "$$(( $$(date +%s) - created ))" -lt 3300
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./knowledge:/app/knowledge
      - ./cache:/app/cache
      - ./config:/app/config
      - ./scripts:/app/scripts
      - vertex_tokens:/var/run/vertex-token:ro
    environment:
      VERTEX_ACCESS_TOKEN_FILE: /var/run/vertex-token/credentials
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
      vertex-token:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Bind mount so vector data survives `docker compose down` / rebuilds.
      # Do NOT use `docker compose down -v` unless you intentionally wipe Qdrant.
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
    name: okf_qdrant_data
  vertex_tokens:
    name: okf_vertex_tokens
