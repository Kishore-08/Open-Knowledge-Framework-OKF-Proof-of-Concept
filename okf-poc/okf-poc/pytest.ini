[pytest]
# app.ingestion.crawler and app.ingestion.pipeline are async; this lets
# tests/test_crawler.py use plain `async def test_...` functions decorated
# with @pytest.mark.asyncio without extra per-test event-loop boilerplate.
asyncio_mode = auto

# tests/integration/ holds live-server smoke scripts (run manually with
# `python3 tests/integration/test_query.py`). They require a running API and
# are not part of the offline pytest suite, so skip them during collection.
norecursedirs =
    tests/integration
    cache
    backups
    .venv
    .venv-eval
