sources:
- name: kubernetes
  base_url: https://kubernetes.io
  sitemap_url: https://kubernetes.io/sitemap.xml
  url_filter: /docs/concepts/
  category: kubernetes
  enabled: true
- name: apache-httpd
  base_url: https://httpd.apache.org
  sitemap_url: https://httpd.apache.org/sitemap.xml
  url_filter: /docs/
  category: apache
  enabled: false
- name: linux-man-pages
  base_url: https://man7.org/linux/man-pages/
  index_url: https://man7.org/linux/man-pages/dir_all_alphabetic.html
  url_filter: man7.org/linux/man-pages/man
  category: linux
  enabled: false
  max_urls: 60
- name: python
  base_url: https://docs.python.org/3/library/
  index_url: https://docs.python.org/3/library/index.html
  url_filter: docs.python.org/3/library/
  category: python
  enabled: false
- name: apache-airflow
  base_url: https://airflow.apache.org/docs/apache-airflow/stable/
  index_url: https://airflow.apache.org/docs/apache-airflow/stable/index.html
  url_filter: docs/apache-airflow/stable/
  exclude_filters:
  - /_static/
  - /_images/
  - /_sources/
  - genindex.html
  - search.html
  - py-modindex.html
  category: airflow
  enabled: false
- name: fastapi
  base_url: https://fastapi.tiangolo.com
  sitemap_url: https://fastapi.tiangolo.com/sitemap.xml
  url_filter: fastapi.tiangolo.com/tutorial/
  category: fastapi
  enabled: false
- name: langchain
  base_url: https://python.langchain.com
  sitemap_url: https://python.langchain.com/sitemap.xml
  url_filter: /docs/
  category: langchain
  enabled: false
crawler:
  delay: 0.05
  timeout: 30
  max_urls_per_source: 50
  user_agent: OKF-Crawler/1.0
