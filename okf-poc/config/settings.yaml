# OKF Enterprise PoC - Global Application Settings
# This file externalizes the parameters for chunking, models, and retrieval.
# NOTE: environment variables (see .env) take precedence over these defaults.

project:
  name: "OKF Knowledge Assistant PoC"
  version: "1.0.0"
  environment: "development"
  log_level: "INFO"

paths:
  raw_data_dir: "data/raw"
  okf_data_dir: "knowledge/source_1"
  knowledge_dir: "knowledge"
  cache_dir: "cache"
  sources_config: "config/sources.yaml"
  evaluation_dataset: "evaluation/dataset.json"
  evaluation_results_dir: "evaluation/results"

rag_pipeline:
  chunking:
    chunk_size: 512
    chunk_overlap: 50
  retrieval:
    similarity_top_k: 5
    sparse_top_k: 5
    alpha: 0.5

models:
  generation:
    name: "gemini-flash-lite-latest"
    temperature: 0.1
  embedding:
    name: "models/gemini-embedding-001"

vector_database:
  provider: "qdrant"
  collection_name: "okf_knowledge"
  concepts_collection_name: "okf_concepts"
  # NOTE: hybrid (sparse) vectors are disabled because fastembed 0.8.x +
  # qdrant-client 1.18.x + llama-index-vector-stores-qdrant 0.10.x have a
  # payload mismatch that produces Qdrant '503 Illegal metadata'. Dense semantic
  # search + filesystem keyword search is used instead.
  enable_hybrid: false
  upload_batch_size: 20

concept_splitter:
  min_chars: 200
  max_chars: 4000
