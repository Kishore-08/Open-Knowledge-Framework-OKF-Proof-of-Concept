supplements:
  - id: kubernetes-network-policy-definition
    title: Network Policies
    category: kubernetes
    source_url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    match_terms: [network traffic, network policy, networkpolicy, between pods]
    content: >-
      NetworkPolicies specify how Pods are allowed to communicate with other
      Pods, namespaces, IP blocks, and other network entities. A network plugin
      that supports NetworkPolicy enforcement applies these rules.

  - id: kubernetes-service-network-identity
    title: Service network identity
    category: kubernetes
    source_url: https://kubernetes.io/docs/concepts/services-networking/service/
    match_terms: [service in kubernetes, kubernetes service, what is a service]
    content: >-
      A Kubernetes Service exposes an application running on a changing set of
      Pods through a stable network identity. A standard Service has a cluster
      IP address, and cluster DNS creates a DNS record so clients can resolve
      the Service by name even as its backing Pods change.

  - id: kubernetes-failed-liveness-probe
    title: Probe results
    category: kubernetes
    source_url: https://kubernetes.io/docs/concepts/workloads/pods/probes/
    match_terms: [liveness probe fails, failed liveness probe, liveness failure]
    content: >-
      When a liveness probe reaches its configured failure threshold, the
      kubelet kills the container. The container is then subjected to its
      configured restart policy.

  - id: kubernetes-service-types
    title: Kubernetes Service types
    category: kubernetes
    source_url: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    match_terms: [types of services, service types, different types of service]
    content: >-
      Kubernetes has four Service types. ClusterIP exposes the Service on a
      cluster-internal IP and is the default. NodePort exposes it on each
      Node's IP at a static port. LoadBalancer exposes it externally through
      an external load balancer. ExternalName maps the Service to an external
      DNS name by returning a CNAME record; it does not set up proxying.

  - id: linux-distribution-examples
    title: Linux distributions
    category: linux
    source_url: https://github.com/opencontainers/runc/blob/main/docs/cgroup-v2.md
    match_terms:
      - types of linux os
      - types of linux operating system
      - linux os types
      - linux distributions
      - differnt types of linux os
    content: >-
      Linux is a kernel rather than one single operating-system edition.
      Complete operating systems built around it are called Linux
      distributions. Examples represented in the knowledge base include
      Ubuntu, Debian GNU/Linux, Fedora, and Arch Linux. These are examples of
      Linux distributions, not different Linux kernels.
